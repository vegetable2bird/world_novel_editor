name: Deploy to Tencent Cloud Lighthouse

# 触发：推送 main 或手动 workflow_dispatch。
# 策略：GitHub Actions(Linux, 有外网) 完成依赖安装与构建，
#       把「运行时产物包」SCP 到服务器【用户家目录】(普通用户可写)，
#       再 SSH 用 sudo 切库 + 写 systemd 单元 + 重启。
#       服务器本身不需要 npm install / 构建（绕开禁外网限制）。
#       数据库用 SQLite（零成本）：DB 文件落 /var/lib/wanxiang-v2/wanxiang.db，
#       位于应用目录之外，避免每次部署被覆盖。
#
# 服务器登录用户为普通用户（腾讯云 Ubuntu 镜像默认 `ubuntu`），
# 因此：scp 目标必须是家目录；所有特权操作走 sudo（需 NOPASSWD）。
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      PORT: "80"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 曾出现「npm ci 静默卡死 8 分钟后崩(Exit handler never called!)」——
      # 真因是 lockfile 的 resolved 字段全部指向内网私有镜像(172.16.x.x)，runner 在公网不可达。
      # 现已换源为 registry.npmjs.org 并由仓库根 .npmrc 钉死，安装恢复正常速度。
      - name: Install dependencies
        env:
          PRISMA_SKIP_POSTINSTALL_GENERATE: "1"
        run: |
          npm config set fetch-retries 3
          npm config set fetch-timeout 300000
          npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build (shared + web + server)
        run: npm run build

      - name: Prune dev dependencies (runtime only)
        run: npm prune --omit=dev

      - name: Restore Prisma CLI (server runs `db push` at deploy)
        run: npm install prisma@5.22.0 --no-save --no-audit --no-fund

      - name: Assemble deploy bundle
        run: |
          rm -rf deploy-bundle
          mkdir -p deploy-bundle/apps/server deploy-bundle/apps/web deploy-bundle/prisma
          cp -rL apps/server/dist deploy-bundle/apps/server/
          cp -rL apps/web/dist deploy-bundle/apps/web/
          cp -rL prisma deploy-bundle/prisma
          cp -rL node_modules deploy-bundle/node_modules
          echo "bundle size:" && du -sh deploy-bundle

      # 传到普通用户可写的家目录（/opt 与 /etc 普通用户写不了）
      - name: Upload bundle to server (staging in home)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "deploy-bundle/"
          target: "/home/ubuntu/wanxiang-staging"

      - name: Cutover, migrate & restart on server (sudo)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            APP_DIR=/opt/wanxiang-v2
            DATA_DIR=/var/lib/wanxiang-v2
            STAGING_ROOT=/home/ubuntu/wanxiang-staging

            # 定位产物包根目录（scp 落点可能多套一层 deploy-bundle）
            MAIN_JS=$(find "$STAGING_ROOT" -maxdepth 6 -path '*apps/server/dist/main.js' | head -1)
            if [ -z "$MAIN_JS" ]; then echo "未找到产物 main.js，检查 scp 落点"; exit 1; fi
            BUNDLE=$(cd "$(dirname "$MAIN_JS")/../../.." && pwd)
            echo "bundle root: $BUNDLE"

            # 释放 80 端口：停掉旧服务（旧 server.cjs 与可能的新服务）
            sudo systemctl stop wanxiang-v2 2>/dev/null || true
            sudo systemctl stop wne-server 2>/dev/null || true
            sudo systemctl disable wne-server 2>/dev/null || true

            # 切换产物（staging -> 正式目录）
            sudo rm -rf "$APP_DIR"
            sudo mv "$BUNDLE" "$APP_DIR"

            # 写运行时 .env（含 secret；GitHub 日志会自动打码）
            # JWT_SECRET 行由 GitHub Actions 在派发前替换为真实值；
            # 引号 heredoc 防止 secret 内特殊字符被 shell 二次展开。
            sudo tee "$APP_DIR/.env" >/dev/null <<'ENV'
            DATABASE_URL=file:/var/lib/wanxiang-v2/wanxiang.db
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=7d
            PORT=80
            NODE_ENV=production
            ENV

            # 写入 systemd 单元（幂等）
            sudo tee /etc/systemd/system/wanxiang-v2.service >/dev/null <<'UNIT'
            [Unit]
            Description=Wanxiang v2 Server
            After=network.target

            [Service]
            Type=simple
            WorkingDirectory=/opt/wanxiang-v2
            ExecStart=/usr/bin/env node /opt/wanxiang-v2/apps/server/dist/main.js
            Restart=always
            RestartSec=3
            Environment=NODE_ENV=production
            EnvironmentFile=/opt/wanxiang-v2/.env

            [Install]
            WantedBy=multi-user.target
            UNIT
            sudo systemctl daemon-reload
            sudo systemctl enable wanxiang-v2

            # 建库/同步 schema（SQLite，DB 文件落持久目录，避免部署覆盖）
            sudo mkdir -p "$DATA_DIR"
            sudo env DATABASE_URL="file:$DATA_DIR/wanxiang.db" \
              node "$APP_DIR/node_modules/.bin/prisma" db push --skip-generate --schema "$APP_DIR/prisma/schema.prisma"

            # 启动
            sudo systemctl restart wanxiang-v2
            sleep 3
            sudo systemctl is-active wanxiang-v2

            # 健康检查（用 node fetch，规避服务器被禁的 curl）
            node -e "fetch('http://127.0.0.1:80/api/health').then(r=>{console.log('health',r.status);process.exit(r.ok?0:1)}).catch(e=>{console.error('health fail',e.message);process.exit(1)})"
