name: Deploy to Tencent Cloud Lighthouse

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to 154.8.220.104
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            APP_DIR=/opt/wanxiang-v2
            cd "$APP_DIR"
            git fetch --all
            git reset --hard origin/main
            npm install
            npm run prisma:generate
            npm run db:push
            npm run build
            pm2 restart wanxiang-server || pm2 start "node apps/server/dist/main.js" --name wanxiang-server
            pm2 save
